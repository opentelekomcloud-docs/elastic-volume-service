          Number of disks to be created in a batch. If this parameter is not specified, only one disk is created. You can create a maximum of 100 disks in a batch.
                      If disks are created from a backup, batch creation is not supported, and this parameter must be set to **1**.

                      If the specified parameter value is a decimal, the integral part of the value is used by default when the request is sent.
      description:
        type: "string"
        description: "Disk description. The value can contain a maximum of 255 bytes."
      enterprise_project_id:
        type: "string"
        description: "Enterprise project ID. This ID is associated with the disk during the disk creation."
      imageRef:
        type: "string"
        description: "Image ID. If this parameter is specified, the disk is created from an image."
        x-huawei-extraAnnotation: ""
      metadata:
        type: "object"
        description: "Metadata of the disk to be created.  \\n \\n Optional parameters are as follows:   \\n[\\_\\_system\\_\\_cmkid]  \\n If parameter **cmkid** in **metadata** and parameter **system\\_\\_encrypted** are used together, the disk is encrypted. The length of **cmkid** is fixed at 36 bytes. \\n\\n> \\n> For details about how to obtain the key ID, see \"[Querying the List of CMKs] (https://support.huaweicloud.com/en-us/api-dew/ListKeys.html)\".  \\n\\n[\\_\\_system\\_\\_encrypted]  \\n Encryption field in **metadata**. The value can be **0** (not encrypted) or **1** (encrypted). If this parameter is not specified, the encryption attribute of the disk is the same as that of the data source. If the disk is not created from a data source, the disk is not encrypted by default.   \\n\\n[full_clone]  \\n If the disk is created from a snapshot and linked cloning needs to be used, set this parameter to **0**.   \\n\\n[hw:passthrough]  \\n\\n* If this parameter is set to **true**, the disk device type is SCSI, which allows ECS OSs to directly access the underlying storage media. SCSI reservation command is supported.   \\n  If this parameter is set to **false**, the disk device type is VBD, which supports only simple SCSI read/write commands.   \\n If this parameter does not appear, the disk device type is VBD.   \\n\\n[create\\_for\\_volume\\_id]\\n\\n* **true** indicates that the disk ID is returned in the **volume_ids** field in the response. \\n* **false** indicates that the created disk ID is not returned in the response. \\n\\n If this parameter does not exist, the default value is **false**."
        additionalProperties:
          type: "string"
          description: ""
        x-huawei-extraAnnotation: ""
      multiattach:
        type: "boolean"
        description: "Whether the disk is shareable. The value can be **true** (a shared disk) or **false** (a common disk)."
      name:
        type: "string"
        description: |
          Disk name.
                      If you create disks one by one, the **name** value is the disk name. The value can contain a maximum of 255 bytes.
                      If you create multiple disks (the **count** value is greater than **1**), the system automatically adds a hyphen followed by a four-digit incremental number, such as **-0000**, to the end of each disk name. For example, the disk names can be **volume-0001** and **volume-0002**. The value can contain a maximum of 250 bytes.
      size:
        type: "integer"
        format: "int32"
        description: |
          EVS disk size, in GB. Constraints are as follows:
                       System disk: 1 GB to 1024 GB
                       Data disk: 10 GB to 32768 GB
                       This parameter is mandatory when you create an empty disk or use an image or a snapshot to create a disk. If you use an image or a snapshot to create a disk, the disk size must be greater than or equal to the image or snapshot size.
                      This parameter is optional when you create the disk from a backup. If this parameter is not specified, the disk size is equal to the backup size.
      snapshot_id:
        type: "string"
        description: "Snapshot ID. If this parameter is specified, the disk is created from a snapshot."
      volume_type:
        type: "string"
        description: |
          Disk type.

                      Currently, the value can be **SATA**, **SAS**, **GPSSD**, **SSD**, or **ESSD**.

                      - **SATA**: specifies common I/O disks (sold out).
                      - **SAS**: specifies high I/O disks.
                      - **GPSSD**: specifies general-purpose SSD disks.
                      - **SSD**: specifies ultra-high I/O disks.
                      - **ESSD**: specifies ultra-high I/O disks.

                      If the specified EVS disk type is not available in the AZ, the disk will fail to create.

                      > Note:
                      > During EVS disk creation from a snapshot, the value of the **volume_type** field must be the same as that of the source EVS disk.
                      > For details about disk types, see [Disk Types and Disk Performance] (https://support.huaweicloud.com/en-us/productdesc-evs/en-us_topic_0044524691.html).
        enum:
          - "SATA"
          - "SAS"
          - "GPSSD"
          - "SSD"
          - "ESSD"
      tags:
        type: "object"
        description: "Disk tag information."
        additionalProperties:
          type: "string"
          description: ""
    description: "EVS disk information."
