      links:
        type: "array"
        description: "Links of the disk transfer"
        items:
          $ref: "#/definitions/Link"
      name:
        type: "string"
        description: "Name of the disk transfer"
      volume_id:
        type: "string"
        description: "EVS disk ID."
  VolumeType:
    required:
