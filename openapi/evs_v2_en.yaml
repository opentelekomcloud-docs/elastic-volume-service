        - "EVS Disk"
      summary: "Querying Details About All Disks"
      description: "This API is used to query details about all disks."
      operationId: "ListVolumes"
      consumes: []
      produces: []
      parameters:
        - name: "project_id"
          in: "path"
          description: |
            Project ID.
                      For details about how to obtain the project ID, see "[Obtaining a Project ID] (https://support.huaweicloud.com/en-us/api-evs/evs_04_0046.html)".
          required: true
          type: "string"
          x-order: 2
        - name: "availability_zone"
          in: "query"
          description: "AZ information."
          required: false
          type: "string"
          x-order: 11
          x-admin: ""
          x-internal: ""
        - name: "dedicated_storage_id"
          in: "query"
          description: "ID of the DSS storage pool. All disks in the DSS storage pool can be filtered out. Only exact match is supported."
          required: false
          type: "string"
          x-order: 14
        - name: "dedicated_storage_name"
          in: "query"
          description: "Name of the DSS storage pool. All disks in the DSS storage pool can be filtered out. Fuzzy match is supported."
          required: false
          type: "string"
          x-order: 15
        - name: "enterprise_project_id"
          in: "query"
          description: "Enterprise project ID for filtering. \\n If input parameter **all_granted_eps** exists, disks in all enterprise projects that are within the permission scope will be queried. \\n\\n> \\n> For details about how to obtain enterprise project IDs and enterprise project features, see \"[Enterprise Management User Guide] (https://support.huaweicloud.com/en-us/usermanual-em/en-us_topic_0123692049.html)."
          required: false
          type: "string"
          x-order: 19
          x-open-region-cloud: ""
        - name: "id"
          in: "query"
          description: "EVS disk ID."
          required: false
          type: "string"
          x-order: 17
        - name: "ids"
          in: "query"
          description: |
            Disk IDs. The parameter value is in the ids=['id1','id2',...,'idx'] format. In the response, the **ids** value contains valid disk IDs only. Invalid disk IDs will be ignored.
                      Details about a maximum of 60 disks can be queried.
                      If parameters **id** and **ids** are both specified in the request, **id** will be ignored.
          required: false
          type: "string"
          x-order: 18
        - name: "limit"
          in: "query"
          description: "Maximum number of query results that can be returned. The default value is **1000**."
          required: false
          type: "integer"
          default: 1000
          maximum: 1000
          minimum: 1
          format: "int32"
          x-order: 5
        - name: "marker"
          in: "query"
          description: "Enter an EVS ID to query by page. By default, data on the first page is queried."
          required: false
          type: "string"
          x-order: 3
        - name: "metadata"
          in: "query"
          description: "Disk metadata."
          required: false
          type: "string"
          x-order: 10
        - name: "multiattach"
          in: "query"
          description: |
            Whether the disk is shareable.
                      **true**: specifies a shared disk.
                      **false**: specifies a non-shared disk.
          required: false
          type: "boolean"
          x-order: 12
        - name: "name"
          in: "query"
          description: "Disk name."
          required: false
          type: "string"
          x-order: 4
        - name: "offset"
          in: "query"
          description: "Offset. All disks after this offset will be queried. The value must be an integer greater than 0 but less than the number of disks."
          required: false
          type: "integer"
          format: "int32"
          x-order: 7
        - name: "server_id"
          in: "query"
          description: "Server ID."
          required: false
          type: "string"
          x-order: 20
          x-open-region-cloud: ""
        - name: "service_type"
          in: "query"
          description: "Service type. Currently, the supported services are EVS, DSS, and DESS."
          required: false
          type: "string"
          x-order: 13
        - name: "sort_dir"
          in: "query"
          description: |
            Result sorting order. The default value is **desc**.
                      **desc**: descending
                      **asc**: ascending
          required: false
          type: "string"
          x-order: 8
        - name: "sort_key"
          in: "query"
          description: "Keyword based on which the returned results are sorted. The value can be **id**, **status**, **size**, or **created_at**, and the default value is **created_at**."
          required: false
          type: "string"
          x-order: 6
        - name: "status"
          in: "query"
          description: "Disk status. For details, see \"[EVS Disk Status] (https://support.huaweicloud.com/en-us/api-evs/evs_04_0040.html)\"."
          required: false
          type: "string"
          x-order: 9
        - name: "volume_type_id"
          in: "query"
