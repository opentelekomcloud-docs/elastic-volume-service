definitions:
  Attachment:
    required:
      - "attached_at"
      - "attachment_id"
      - "device"
      - "host_name"
      - "id"
      - "server_id"
      - "volume_id"
    properties:
      attached_at:
        type: "string"
        description: |
          Time when the disk was attached.

                      Time format: UTC YYYY-MM-DDTHH:MM:SS.XXXXXX
      attachment_id:
        type: "string"
        description: "ID of the attachment information."
      device:
        type: "string"
        description: "Device name."
      host_name:
        type: "string"
        description: "Name of the physical host accommodating the server to which the disk is attached."
      id:
        type: "string"
        description: "ID of the attached disk."
      server_id:
        type: "string"
        description: "ID of the server to which the EVS disk is attached."
      volume_id:
        type: "string"
        description: "EVS disk ID."
    description: "Disk attachment information."
  BatchCreateVolumeTagsDTRequestBody:
    required:
      - "action"
      - "tags"
    properties:
      action:
        type: "string"
        description: |
          Operation. The value can be as follows:

                      **create**: add tags
      tags:
        description: ""
        $ref: "#/definitions/Tag"
    description: "This is a auto create Body Object"
  BatchCreateVolumeTagsRequestBody:
    required:
      - "action"
      - "tags"
    properties:
      action:
        type: "string"
        example: "create"
        description: |
          Operation. The value can be as follows:

                      **create**: add tags
        enum:
          - "create"
        default: "create"
      tags:
        type: "array"
        example: "\"[{ \\\"key\\\": \\\"key1\\\", \\\"value\\\": \\\"value1\\\"},{\\\"key\\\": \\\"key2\\\",\\\"value\\\": \\\"value3\\\"}]\""
        description: "Tag list."
        items:
          description: ""
          $ref: "#/definitions/Tag"
    description: "This is a auto create Body Object"
  BatchDeleteVolumeTagsRequestBody:
    required:
      - "action"
      - "tags"
    properties:
      action:
        type: "string"
        example: "delete"
        description: |
          Operation. The value can be as follows:

                      **delete**: delete tags
        enum:
          - "delete"
        default: "delete"
        x-admin: ""
        x-internal: ""
      tags:
        type: "array"
        example: "\"[ { \\\"key\\\": \\\"key1\\\" }, { \\\"key\\\": \\\"key2\\\" } ]\""
        description: "Tag list."
        items:
          $ref: "#/definitions/DeleteTagsOption"
    description: "This is a auto create Body Object"
  BssParamForCreateVolume:
    properties:
      chargingMode:
        type: "string"
        description: |
          Billing mode. The default value is postPaid.
                      The value can be:
                      **prePaid**: yearly/monthly
                      **postPaid**: pay-per-use
        enum:
          - "postPaid"
          - "prePaid"
        default: "postPaid"
      isAutoPay:
        type: "string"
        description: |
          Whether to pay immediately. This parameter is valid only when **chargingMode** is set to **prePaid**. The default value is **false**.
                      The value can be:
                      **true**: indicates to pay immediately after an order is created. The system will automatically deduct fees from the account balance.
                      **false** indicates not to pay immediately after an order is created.
        enum:
          - "true"
          - "false"
        default: "false"
      isAutoRenew:
        type: "string"
        description: |
          Whether to automatically renew the subscription. This parameter is valid only when **chargingMode** is set to **prePaid**. The default value is **false**.
                      The value can be:
                      **true**: indicates to automatically renew the subscription. The automatic renewal term is the same as the subscription term.
                      **false**: indicates not to automatically renew the subscription.
        enum:
          - "true"
          - "false"
        default: "false"
      periodNum:
        type: "integer"
        format: "int32"
        description: |
          Subscription term. This parameter is valid and mandatory only when **chargingMode** is set to **prePaid**.
                      The value can be：
                      When **periodType** is set to **month**, the parameter value ranges from **1** to **9**.
                      When **periodType** is set to **year**, the parameter value must be set to **1**.
      periodType:
        type: "string"
        description: |
          Unit of the subscription term. This parameter is valid and mandatory only when **chargingMode** is set to **prePaid**.
                      The value can be:
                      **month**: month
                      **year**: year
        enum:
          - "month"
          - "year"
        x-huawei-extraAnnotation: ""
      cloudServiceConsoleURL:
        type: "string"
        description: "After the subscription is completed, this URL can be used to switch to the cloud service console page to view the information."
        x-admin: "True"
        x-internal: "True"
    description: "Billing policy for yearly/monthly disk creation."
  BssParamForResizeVolume:
    properties:
      isAutoPay:
        type: "string"
        description: |
          Whether to pay immediately. This parameter is valid only when the disk is billed on the yearly/monthly basis. The default value is **false**.
                     The value can be:
                      **true**: indicates to pay immediately after an order is created. The system will automatically deduct fees from the account balance.
                      **false**: indicates not to pay immediately after an order is created.
        enum:
          - "false"
          - "true"
        default: "false"
      cloudServiceConsoleURL:
        type: "string"
        description: "After the subscription is completed, this URL can be used to switch to the cloud service console page to view the information."
        x-admin: "True"
        x-internal: "True"
    description: "Billing policy for yearly/monthly disk capacity expansion."
  BssParamForRetypeVolume:
    properties:
      isAutoPay:
        type: "string"
        description: |
          Whether to pay immediately. This parameter is valid only when the disk is billed on the yearly/monthly basis. The default value is **false**.
                     The value can be:
                      **true**: indicates to pay immediately after an order is created. The system will automatically deduct fees from the account balance.
                      **false**: indicates not to pay immediately after an order is created.
        enum:
          - "false"
          - "true"
        default: "false"
      cloudServiceConsoleURL:
        type: "string"
        description: "After the subscription is completed, this URL can be used to switch to the cloud service console page to view the information."
        x-internal: "True"
    description: "Billing policy for yearly/monthly disk retype."
  CreateDiskOption:
    required:
      - "availability_zone"
      - "size"
      - "volume_type"
    properties:
      availability_zone:
        type: "string"
        description: "AZ where you want to create the disk."
        x-huawei-extraAnnotation: ""
      backup_id:
        type: "string"
        description: "Backup ID. This parameter is mandatory when you create the disk from a backup."
      count:
        type: "integer"
        format: "int32"
        description: |
          Number of disks to be created in a batch. If this parameter is not specified, only one disk is created. You can create a maximum of 100 disks in a batch.
                      If disks are created from a backup, batch creation is not supported, and this parameter must be set to **1**.

                      If the specified parameter value is a decimal, the integral part of the value is used by default when the request is sent.
      description:
        type: "string"
        description: "Disk description. The value can contain a maximum of 255 bytes."
      enterprise_project_id:
        type: "string"
        description: "Enterprise project ID. This ID is associated with the disk during the disk creation."
      imageRef:
        type: "string"
        description: "Image ID. If this parameter is specified, the disk is created from an image."
      metadata:
        type: "object"
        description: "Metadata of the disk to be created.  \\n Optional parameters are as follows:   \\n If parameter **cmkid** in **metadata** and parameter **system\\_\\_encrypted** are used together, the disk is encrypted. The length of **cmkid** is fixed at 36 bytes. \\n> \\n> \\n> For details about how to obtain the key ID, see \"[Querying the List of CMKs] (https://support.huaweicloud.com/en-us/api-dew/ListKeys.html)\".  \\n\\n\\_\\_system\\_\\_encrypted:  Encryption field in **metadata**. The value can be **0** (not encrypted) or **1** (encrypted). If this parameter is not specified, the encryption attribute of the disk is the same as that of the data source. If the disk is not created from a data source, the disk is not encrypted by default.   \\n\\nfull_clone: If the disk is created from a snapshot and linked cloning needs to be used, set this parameter to **0**.   \\n\\nhw:passthrough:\\t \\n If this parameter is set to **true**, the disk device type is SCSI, which allows ECS OSs to directly access the underlying storage media. SCSI reservation command is supported. \\n If this parameter is set to **false**, the disk device type is VBD, which supports only simple SCSI read/write commands. \\n If this parameter does not exist, the VBD type is used by default. \\n"
        additionalProperties:
          type: "string"
          description: ""
        x-huawei-extraAnnotation: ""
      multiattach:
        type: "boolean"
        description: "Whether the disk is shareable. The value can be **true** (a shared disk) or **false** (a common disk)."
      name:
        type: "string"
        description: |
          Disk name.
                      If you create disks one by one, the **name** value is the disk name. The value can contain a maximum of 255 bytes.
                      If you create multiple disks (the **count** value is greater than 1), the system automatically adds a hyphen followed by a four-digit incremental number, such as **-0000**, to the end of each disk name. For example, the disk names can be **volume-0001** and **volume-0002**. The value can contain a maximum of 250 bytes.
      shareable:
        type: "string"
        description: |
          Whether the disk is shareable. The value can be **true** (a shared disk) or **false** (a common disk).
                      This field is no longer used. Use **multiattach**.
      size:
        type: "integer"
        format: "int32"
        description: |
          EVS disk size, in GB. Constraints are as follows:
                      System disk: 1 GB to 1024 GB
                      Data disk: 10 GB to 32768 GB
                      This parameter is mandatory when you create an empty disk or use an image or a snapshot to create a disk. If you use an image or a snapshot to create a disk, the disk size must be greater than or equal to the image or snapshot size.
                      This parameter is optional when you create the disk from a backup. If this parameter is not specified, the disk size is equal to the backup size.
      snapshot_id:
        type: "string"
        description: "Snapshot ID. If this parameter is specified, the disk is created from a snapshot."
      volume_type:
        type: "string"
        description: |
          Disk type.

                      Currently, the value can be **SATA**, **SAS**, **GPSSD**, **SSD**, or **ESSD**.

                      - **SATA**: specifies common I/O disks (sold out)
                      - **SAS**: specifies high I/O disks
                      - **GPSSD**: specifies general-purpose SSD disks
                      - **SSD**: specifies ultra-high I/O disks
                      - **ESSD**: specifies ultra-high I/O disks.

                      If the specified EVS disk type is not available in the AZ, the disk will fail to create.

                      > Note:
                      > During EVS disk creation from a snapshot, the value of the **volume_type** field must be the same as that of the source EVS disk.
                      > For details about disk types, see [Disk Types and Disk Performance] (https://support.huaweicloud.com/en-us/productdesc-evs/en-us_topic_0044524691.html).
        enum:
          - "SATA"
          - "SAS"
          - "GPSSD"
          - "SSD"
          - "ESSD"
      tags:
        type: "object"
        description: "Disk tag information."
        additionalProperties:
          type: "string"
          description: ""
    description: " "
  CreateDiskRequestBody:
    required:
      - "volume"
    properties:
      volume:
        description: ""
        $ref: "#/definitions/CreateDiskOption"
    description: "This is a auto create Body Object"
