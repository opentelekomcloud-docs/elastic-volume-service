      x-constraint: ""
      x-version: "v2"
      x-scope: "Commercial"
      x-order: 1
      x-request-examples-description-1: ""
      x-request-examples-url-1: "POST https://{endpoint}/v2.1/{project_id}/cloudvolumes"
      x-request-examples-1:
