      x-apiexplorer-hide: "false"
      x-is-registered: "Y"
  /v2.1/{project_id}/cloudvolumes/{volume_id}/action:
    post:
      tags:
        - "EVS Disk"
      summary: "Expanding Capacity of an EVS Disk"
      description: |
        Expanding the capacity of a pay-per-use or yearly/monthly-billed EVS disk.
                For yearly/monthly-billed disks:
                - If you need to view the coupons available for your order, see "[Viewing Coupons Available for an Order] (https://support.huaweicloud.com/en-us/api-oce/en-us_topic_0092953630.html)".
                - If you need to pay for the order, see "[Paying for the Order of Yearly/Monthly-Billed Resources] (https://support.huaweicloud.com/en-us/api-oce/en-us_topic_0075746561.html)".
                - If you need to view the resource provisioning details in your order, see "[Querying Resource Provisioning Details in an Order](https://support.huaweicloud.com/en-us/api-oce/api_order_00001.html)".
                - If you need to unsubscribe from a yearly/monthly resource, see "[Unsubscribing from Year/Monthly Resources](https://support.huaweicloud.com/en-us/api-oce/en-us_topic_0082522030.html)".
      operationId: "ResizeVolume"
      consumes: []
      produces: []
      parameters:
        - name: "project_id"
          in: "path"
          description: |
            Project ID.
                      For details about how to obtain the project ID, see "[Obtaining a Project ID] (https://support.huaweicloud.com/en-us/api-evs/evs_04_0046.html)".
          required: true
          type: "string"
          x-order: 2
        - name: "volume_id"
          in: "path"
          description: "EVS disk ID."
          required: true
          type: "string"
          x-order: 3
        - name: "X-Auth-Token"
          in: "header"
          description: |
            User token.
                      The token can be obtained by calling the IAM API used to obtain user tokens. The value of **X-Subject-Token** in the response header is the user token.
          required: true
          type: "string"
          x-order: 1
        - in: "body"
          name: "ResizeVolumeRequestBody"
          description: "This is a auto create Body Object"
          required: true
          schema:
            $ref: "#/definitions/ResizeVolumeRequestBody"
      responses:
        "202":
          description: "Accepted"
          examples:
            application/json:
              job_id: "70a599e0-31e7-49b7-b260-868f441e862b"
            application/json-1:
              order_id: "CS1711152257C60TL"
          schema:
            $ref: "#/definitions/ResizeVolumeResponseBody"
        "400":
          description: "Bad Request"
          examples:
            application/json:
              error:
                message: "XXXX"
                code: "XXX"
          schema:
            $ref: "#/definitions/ErrorResponseBody"
      deprecated: false
      x-name: "Expanding Capacity of an EVS Disk"
      x-constraint: |
        * If the status of the to-be-expanded disk is **available**, there are no restrictions.
                * If the status of the to-be-expanded disk is in-use, the restrictions are as follows:
                    * A shared disk cannot be expanded, that is, the value of parameter **multiattach** must be **false**.
                    * The status of the server to which the disk attached must be **ACTIVE**, **PAUSED**, **SUSPENDED**, or **SHUTOFF**.
      x-version: "v2"
      x-scope: "Commercial"
      x-order: 3
      x-request-examples-description-1: ""
      x-request-examples-url-1: "POST https://{endpoint}/v2.1/{project_id}/cloudvolumes/{volume_id}/action"
      x-request-examples-1:
        os-extend:
          new_size: 100
        bssParam:
          isAutoPay: "true"
      x-request-examples-text-1: "{\n    \"os-extend\": {\n        \"new_size\": 100\n    }, \n    \"bssParam\": {\n        \"isAutoPay\": \"true\"\n    }\n}\n"
      x-publishpath: "evs_04_2004"
      x-hybridcloud: ""
      x-source: "SelfDeveloped"
      x-support-sdk: "Y"
      x-first-open-time: "2017/9/30"
      x-open-region-cloud: "hc,hk"
      x-apiexplorer-hide: "false"
      x-is-registered: "Y"
