          availability_zone: "az1.dc1"
          volume_type: "SATA"
          size: 120
          description: "test"
          multiattach: true
          count: 1
          tags:
            key1: "value1"
            key2: "value2"
        bssParam:
          chargingMode: "prePaid"
          periodType: "year"
          periodNum: 1
          isAutoPay: "true"
          isAutoRenew: "true"
      x-request-examples-text-1: |-
        {
            "volume":{
                "name":"test_volume_3",
