  SnapshotDetail:
    required:
      - "created_at"
      - "id"
      - "os-extended-snapshot-attributes:progress"
      - "os-extended-snapshot-attributes:project_id"
      - "size"
      - "status"
      - "volume_id"
    properties:
      id:
        type: "string"
        description: "Snapshot ID."
      name:
        type: "string"
        description: |
          Snapshot name.

                      Snapshots whose names started with prefix **autobk_snapshot_** are automatically created by the system during backup creations. Do not delete these snapshots or use them to roll back the disk data.
      description:
        type: "string"
        description: "Snapshot description."
      created_at:
        type: "string"
        description: |
          Time when the snapshot was created.

                      Time format: UTC YYYY-MM-DDTHH:MM:SS.XXXXXX
      update_at:
        type: "string"
        description: "Time when the snapshot was updated."
      metadata:
        type: "object"
        description: "Snapshot metadata."
        additionalProperties:
          type: "string"
      volume_id:
        type: "string"
        description: "ID of the snapshot's source disk."
      size:
        type: "string"
        description: "Snapshot size, in GB."
      status:
        type: "string"
        description: "EVS snapshot status. For details, see [EVS Snapshot Status] (https://support.huaweicloud.com/en-us/api-evs/evs_04_0041.html)."
      os-extended-snapshot-attributes:progress:
        type: "string"
        description: "Reserved field."
      os-extended-snapshot-attributes:project_id:
        type: "string"
        description: "Tenant ID, which is the project ID."
  SnapshotSummary:
    required:
      - "created_at"
      - "id"
      - "size"
      - "status"
      - "volume_id"
    properties:
      created_at:
        type: "string"
        description: |
          Time when the snapshot was created.

                      Time format: UTC YYYY-MM-DDTHH:MM:SS.XXXXXX
      description:
        type: "string"
        description: "Snapshot description."
      id:
        type: "string"
        description: "Snapshot ID."
      metadata:
        type: "object"
        description: |
          Snapshot metadata.

                      If **metadata** contains the **__system__enableActive** field, the snapshot is automatically created during the backup of a server.
        additionalProperties:
          type: "string"
          description: ""
      name:
        type: "string"
        description: "Snapshot name"
      size:
        type: "integer"
        format: "int32"
        description: "Snapshot size, in GB."
      status:
        type: "string"
        description: "EVS snapshot status. For details, see [EVS Snapshot Status] (https://support.huaweicloud.com/en-us/api-evs/evs_04_0041.html)."
      update_at:
        type: "string"
        description: |
          Time when the snapshot was updated.

                      Time format: UTC YYYY-MM-DDTHH:MM:SS.XXXXXX
      volume_id:
        type: "string"
        description: "ID of the snapshot's source disk."
  VolumeAttachment:
    required:
      - "attached_at"
      - "attachment_id"
      - "device"
      - "host_name"
      - "id"
      - "server_id"
      - "volume_id"
    properties:
      attached_at:
        type: "string"
        description: |
          Time when the disk was attached.

                      Time format: UTC YYYY-MM-DDTHH:MM:SS.XXXXXX
      attachment_id:
        type: "string"
        description: "ID of the attachment information."
      device:
        type: "string"
        description: "Device name."
      host_name:
        type: "string"
        description: "Name of the physical host accommodating the ECS to which the EVS disk is attached."
      id:
        type: "string"
        description: "ID of the attached disk."
      server_id:
        type: "string"
        description: "ID of the ECS to which the EVS disk is attached."
      volume_id:
        type: "string"
        description: "EVS disk ID."
    description: "Description of the **attachments** field"
  VolumeBody:
    required:
      - "id"
      - "links"
    properties:
      id:
        type: "string"
        description: "EVS disk ID."
      links:
        type: "array"
        description: "URI of the EVS disk."
        items:
          $ref: "#/definitions/Link"
      name:
        type: "string"
        description: "Disk name."
    description: ""
  OpenStackVolumeDetail:
    required:
      - "availability_zone"
      - "created_at"
      - "id"
      - "links"
      - "metadata"
      - "multiattach"
      - "replication_status"
      - "shareable"
      - "size"
      - "status"
      - "user_id"
      - "volume_type"
    properties:
      id:
        type: "string"
        description: "EVS disk ID."
      links:
        type: "array"
        description: "URI of the EVS disk."
        items:
          description: ""
          $ref: "#/definitions/Link"
      name:
        type: "string"
        description: "Disk name."
      status:
        type: "string"
        description: "EVS disk status. For details, see [EVS Disk Status] (https://support.huaweicloud.com/en-us/api-evs/evs_04_0040.html)."
      attachments:
        type: "array"
        description: "Whether the disk is attached."
        items:
          $ref: "#/definitions/VolumeAttachment"
      availability_zone:
        type: "string"
        description: "AZ to which the disk belongs."
      source_volid:
        type: "string"
        description: |
          Source disk ID. This parameter has a value if the disk is created from a source disk.
                      Currently, this function is not supported.
      snapshot_id:
        type: "string"
        description: "Snapshot ID. This parameter has a value if the disk is created from a snapshot."
      description:
        type: "string"
        description: "EVS disk description."
      bootable:
        type: "string"
        description: |
          Whether the disk is bootable.
                      **true**: specifies a bootable disk.
                      **false**: specifies a non-bootable disk.
      encrypted:
        type: "boolean"
        description: "Currently, this function is not supported."
      created_at:
        type: "string"
        description: |
          Time when the EVS disk was created.

                      Time format: UTC YYYY-MM-DDTHH:MM:SS.XXXXXX
      volume_type:
        type: "string"
        description: |
          Disk type.

                      Currently, the value can be **SSD**, **SAS**, or **SATA**.
                      **SSD** indicates EVS disks with ultra-high I/O.
                      **SAS** indicates EVS disks with high I/O.
                      **SATA** indicates EVS disks with common I/O.
      replication_status:
        type: "string"
        description: "Reserved field."
      consistencygroup_id:
        type: "string"
        description: "Reserved field."
      metadata:
        description: |

        $ref: "#/definitions/VolumeMetadata"
      size:
        type: "integer"
        format: "int32"
        description: "Disk size, in GB."
      user_id:
        type: "string"
        description: "Reserved field."
      updated_at:
        type: "string"
        description: |
          Time when the disk was updated.

                      Time format: UTC YYYY-MM-DDTHH:MM:SS.XXXXXX
      shareable:
        type: "boolean"
        description: |
          Whether the EVS disk is shareable.
                      Note:
                      This field has been discarded. Please use **multiattach**.
      multiattach:
        type: "boolean"
        description: "Whether the EVS disk is shareable."
      os-vol-tenant-attr:tenant_id:
        type: "string"
        description: "ID of the tenant to which the disk belongs. The tenant ID is the project ID."
      volume_image_metadata:
        type: "object"
        description: "Metadata of the disk image. \\n\\n> \\n>  For details about the **volume_image_metadata** field, see \"[Querying Image Details] (https://support.huaweicloud.com/en-us/api-ims/ims_03_0703.html)\"."
      os-vol-host-attr:host:
        type: "string"
        description: "Reserved field."
      os-volume-replication:extended_status:
        type: "string"
        description: "Reserved field."
      os-vol-mig-status-attr:migstat:
        type: "string"
        description: "Reserved field."
      os-vol-mig-status-attr:name_id:
        type: "string"
        description: "Reserved field."
  VolumeTransfer:
    required:
      - "created_at"
      - "id"
      - "links"
      - "name"
      - "volume_id"
    properties:
      created_at:
        type: "string"
